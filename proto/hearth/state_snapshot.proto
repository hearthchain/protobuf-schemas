syntax = "proto3";
package hearth;
option java_package = "tech.hearth.protobuf.snapshot";
option csharp_namespace = "Hearth";
option go_package = "github.com/hearthchain/protobuf-schemas/gen/go/hearth";

import "hearth/transaction_state_snapshot.proto";

message BlockSnapshot {
  bytes block_id = 1;
  repeated TransactionStateSnapshot snapshots = 2;
}

message MicroBlockSnapshot {
  bytes total_block_id = 1;
  repeated TransactionStateSnapshot snapshots = 2;
}
