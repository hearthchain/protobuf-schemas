syntax = "proto3";

package hearth;

option java_package = "tech.hearth.protobuf.transaction";
option csharp_namespace = "Hearth";
option go_package = "github.com/hearthchain/protobuf-schemas/gen/go/hearth";

import "hearth/amount.proto";
import "hearth/recipient.proto";
import "hearth/order.proto";

message SignedTransaction {
    Transaction transaction = 1;
    repeated bytes proofs = 2;
}

message Transaction {
    int32 chain_id = 1;
    bytes sender_public_key = 2;
    int64 fee = 3;
    int64 timestamp = 4;

    oneof data {
        TransferTransactionData transfer = 101;
        ExchangeTransactionData exchange = 102;
        LeaseTransactionData lease = 103;
        LeaseCancelTransactionData lease_cancel = 104;
        CommitToGenerationTransactionData commit_to_generation = 105;
        StartBoostTransactionData start_boost = 106;
        ReserveTransactionData reserve = 107;
        BindApiKeyTransactionData bind_api_key = 108;
        SettleTransactionData settle = 109;
        WithdrawTransactionData withdraw = 110;
        UpdateCollateralTransactionData update_collateral = 111;
    };
};

message TransferTransactionData {
    message Transfer {
      Recipient recipient = 1;
      int64 amount = 2;
    };

    bytes asset_id = 1;
    repeated Transfer transfers = 2;
    bytes attachment = 3;
    bytes fee_asset_id = 4;
};

message LeaseTransactionData {
    Recipient recipient = 1;
    int64 amount = 2;
};

message LeaseCancelTransactionData {
    bytes lease_id = 1;
};

message ExchangeTransactionData {
    int64 amount = 1;
    int64 price = 2;
    int64 buy_matcher_fee = 3;
    int64 sell_matcher_fee = 4;
    repeated Order orders = 5;
};

message CommitToGenerationTransactionData {
    uint32 generation_period_start = 1;
    bytes endorser_public_key = 2; // BLS
    bytes commitment_signature = 3; // BLS signature for endorser_public_key ++ generation_period_start
    bytes vrf_public_key = 4;
    bytes vrf_commitment_signature = 5;
}

message StartBoostTransactionData {
    Recipient validator = 1;
    bytes tdx_quote = 2;
    uint32 generation_period_start = 3;
}

message UpdateCollateralTransactionData {
    optional bytes root_ca_crl = 1;
    optional bytes pck_crl = 2;
    optional bytes tcb_info = 3;
    optional bytes qe_identity = 4;
    optional bytes tcb_signing_issuer_chain = 5;
    optional bytes pck_ca_issuer_chain = 6;
}

message BindApiKeyTransactionData {
    bytes enclave_public_key = 1;
    bytes encrypted_api_key = 2;
}

message ReserveTransactionData {
    Amount amount = 1;
    Recipient miner = 2;
    bytes fee_asset_id = 3;
}

message SettleTransactionData {
    // Reconstructed from the node's PBTransactions usage (node PR #33); field numbers follow constructor order.
    bytes enclave_public_key = 1;
    repeated Settlement settlements = 2;
    bytes enclave_signature = 3;

    message Settlement {
        Recipient client = 1;
        Amount cumulative_spent = 2;
    }
}

message WithdrawTransactionData {
    Recipient from_miner = 1;
    Amount amount = 2;
    bytes fee_asset_id = 3;
}
