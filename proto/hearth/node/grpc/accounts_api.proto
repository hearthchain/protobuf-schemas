syntax = "proto3";
package hearth.node.grpc;
option java_package = "tech.hearth.api.grpc";
option csharp_namespace = "Waves.Node.Grpc";
option go_package = "github.com/wavesplatform/gowaves/pkg/grpc/generated/hearth/node/grpc";

import "hearth/amount.proto";
import "hearth/recipient.proto";

service AccountsApi {
    rpc GetBalances (BalancesRequest) returns (stream BalanceResponse);
    rpc GetActiveLeases (AccountRequest) returns (stream LeaseResponse);
}

message AccountRequest {
    bytes address = 1;
}

message BalancesRequest {
    bytes address = 1;
    repeated bytes assets = 4;
}

message BalanceResponse {
    message WavesBalances {
        int64 regular = 1;
        int64 generating = 2;
        int64 available = 3;
        int64 effective = 4;
        int64 lease_in = 5;
        int64 lease_out = 6;
    }

    oneof balance {
        WavesBalances waves = 1;
        Amount asset = 2;
    }
}

message LeaseResponse {
    bytes leaseId = 1;
    bytes originTransactionId = 2;
    bytes sender = 3;
    Recipient recipient = 4;
    int64 amount = 5;
    int64 height = 6;
}
